# ===========================================================================
#  snort_lab.conf — УЧЕБНЫЙ минимальный конфиг Snort (лабораторная работа).
#
#  ВАЖНО ПРО ВЕРСИИ (проверьте на стенде: snort -V):
#      * Синтаксис ЭТОГО файла — Snort 2.9 (текстовый: preprocessor/config).
#        Он оставлен как учебный текст: по нему разбирается устройство IDS.
#      * На стенде стоит Snort 3 (в Alpine `apk add snort` ставит Snort++,
#        на учебном образе — 3.9.2.0). У 3.x конфиг на LUA, поэтому этот файл
#        НЕ подаётся ему напрямую: он конвертируется штатной утилитой
#            sudo snort2lua -c /etc/snort/lab.conf -o /etc/snort/lab.lua
#        а затем в конец /etc/snort/lab.lua дописывается
#            ips.enable_builtin_rules = true      (см. раздел 8a ниже)
#        В учебном образе это уже сделано — рабочий конфиг /etc/snort/lab.lua.
#      * Синтаксис самих ПРАВИЛ (lab.rules) у 2.9 и 3.x в основном совместим.
#
#  ЗАЧЕМ СВОЙ КОНФИГ: штатный snort.lua/snort.conf подключает десятки тысяч
#  правил и все препроцессоры сразу — в нём трудно понять, что сработало.
#
#  ПРОВЕРКА КОНФИГА БЕЗ ЗАХВАТА ТРАФИКА (делать перед каждым запуском!):
#      sudo snort -c /etc/snort/lab.lua -T
#  РАБОТА (на учебном образе):
#      sudo snort -c /etc/snort/lab.lua -i eth0
#
#  Порядок разделов менять нельзя: переменные -> декодер -> классификация ->
#  препроцессоры -> вывод -> правила.
# ===========================================================================

# --- 1. Переменные: какой хост считаем защищаемым -------------------------
#      ВАЖНО: указываем адрес ЖЕРТВЫ (/32), а не всю подсеть!
#      Атакующая ВМ стоит в той же подсети 192.168.56.0/24, поэтому при
#      HOME_NET = 192.168.56.0/24 она попала бы во «внутренние» адреса,
#      и правила вида $EXTERNAL_NET -> $HOME_NET её бы НЕ заметили.
ipvar HOME_NET 192.168.56.10/32
ipvar EXTERNAL_NET !$HOME_NET

# --- 2. Декодер и режим работы ---------------------------------------------
#      ВАЖНО (проверено на Snort 3.9.2.0, Alpine 3.24): директивы
#          config daq: pcap
#          config daq_mode: passive
#      здесь ОТКЛЮЧЕНЫ намеренно. snort2lua переносит их в блок
#          daq = { modules = { { name = 'pcap', mode = 'passive' } } }
#      который ПРИБИВАЕТ модуль DAQ: после этого разбор сохранённого трафика
#      падает с ошибкой
#          Couldn't start DAQ instance (<файл.pcap>): No such device exists (-1)
#          Analyzer: Failed to start DAQ instance
#      (Snort пытается открыть pcap-ФАЙЛ как сетевое устройство).
#      В Snort 3 модуль DAQ выбирается САМ: afpacket — для живой сети (-i eth0),
#      pcap — для -r <файл.pcap>; для inline-IPS он задаётся ключами командной
#      строки (-Q --daq nfq, этап 8). Поэтому в конфиге его указывать не нужно.
config logdir: /var/log/snort

# --- 3. Классы алертов -----------------------------------------------------
#      Свои классы, чтобы не зависеть от наличия /etc/snort/classification.config
#      в конкретной сборке: правило с classtype, которого нет в списке,
#      НЕ загрузится — и на это легко потерять полчаса.
#      Формат: config classification: <имя>,<описание>,<приоритет>
config classification: lab-recon,Разведка: сканирование портов,2
config classification: lab-dos,Атака «отказ в обслуживании»,1
config classification: lab-info,Обычный трафик к учебному сервису,3

# --- 4. Сборка IP-фрагментов ----------------------------------------------
preprocessor frag3_global: max_frags 65536
#      ВНИМАНИЕ: опции 'policy ...' и 'detect_anomalies' в frag3_engine
#      snort2lua (конвертер 2.9 -> 3.x) НЕ понимает и валит всю конвертацию:
#          Failed to convert ...: preprocessor frag3_engine: policy first, detect_anomalies
#          ^^^^ unknown_syntax: policy 'policy'
#      Проверено на Snort 3.9.2.0 (Alpine 3.24): с голым frag3_engine
#      конвертация проходит (код возврата 0), а инспектор frag получает
#      значения по умолчанию (frag_policy = first, лимиты по умолчанию).
preprocessor frag3_engine

# --- 5. Отслеживание TCP-сессий -------------------------------------------
#      !!! stream5_tcp ОБЯЗАТЕЛЕН, если в stream5_global указано track_tcp yes,
#      иначе Snort не стартует: "Stream5 not properly configured".
#      Без stream5 нельзя использовать flow:to_server / flow:established.
preprocessor stream5_global: max_tcp 8192, track_tcp yes, track_udp no, track_icmp no
preprocessor stream5_tcp: policy first, ports both 22 80 443 8080, timeout 60

# --- 6. Обнаружение ARP-спуфинга ------------------------------------------
#      Синтаксис (Snort 2.9):  preprocessor arpspoof[: -unicast]
#                             preprocessor arpspoof_detect_host: <ip> <mac>
#      Хост, указанный в detect_host, — это тот, КОГО ПОДДЕЛЫВАЮТ
#      (наш «шлюз» Windows), вместе с его НАСТОЯЩИМ MAC.
#
#      !! ОБЯЗАТЕЛЬНО ЗАМЕНИТЕ MAC на реальный — узнать ДО атаки, пока
#         ARP-таблица ещё честная:  ip neigh show 192.168.56.1   (на жертве)
#                                   arp -a                        (на Windows)
#      С неверным MAC препроцессор будет срабатывать постоянно.
preprocessor arpspoof
preprocessor arpspoof_detect_host: 192.168.56.1 00:11:22:33:44:55

# --- 7. Обнаружение сканирования портов «из коробки» ----------------------
#      sfportscan анализирует СОСТОЯНИЕ сессий и видит то, чего не видит
#      простое правило со счётчиком: что один источник трогает много РАЗНЫХ
#      портов у одной цели. Требует включённого stream5 (см. раздел 5).
#      Опция memcap здесь НЕ нужна. Если при проверке конфига будут
#      претензии к синтаксису — просто закомментируйте эту строку.
preprocessor sfportscan: proto { all } sense_level { low } logfile { portscan.log }

# --- 8. Куда писать алерты -------------------------------------------------
#      stdout — в консоль (удобно для лабораторной). Ключ командной строки
#      -A console делает то же самое и перекрывает настройку из файла.
output alert_fast: stdout

# --- 8a. ВСТРОЕННЫЕ ПРАВИЛА (только для Snort 3!) ------------------------
#      В 2.9-конфиге такой директивы НЕТ и быть не может — это «шов» между
#      версиями, и его надо закрыть руками после snort2lua:
#
#      В Snort 3 алерты инспекторов (arp_spoof -> gid 112, port_scan -> gid 129,
#      stream -> gid 116 и т.д.) оформлены как ВСТРОЕННЫЕ правила (builtin rules,
#      список: snort --list-builtin). По умолчанию
#          ips.enable_builtin_rules = false
#      и тогда инспектор РАБОТАЕТ, события порождает, но правил для них нет —
#      и в выводе НЕ ПОЯВЛЯЕТСЯ НИ ОДНОГО алерта. Именно так «молчит» проверка
#      ARP-спуфинга, хотя snort --help-module arp_spoof исправно показывает
#      правила 112:1..112:4, а snort -T говорит «0 warnings».
#      Ключа командной строки у этого параметра НЕТ, только поле в конфиге.
#
#      После конвертации добавьте в lab.lua (проверено на Snort 3.9.2.0):
#          ips.enable_builtin_rules = true
#      Удобнее всего — В КОНЕЦ файла: таблица ips там уже создана, поэтому
#      присваивание поля не затирает ips.rules (наши lab.rules). Писать
#      ips = { enable_builtin_rules = true } целиком НЕЛЬЗЯ — это затрёт
#      список правил и сработают только встроенные.
#      Автоматически это делает provision.sh при сборке учебного образа.

# --- 9. Наши правила -------------------------------------------------------
include /etc/snort/rules/lab.rules
